<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerHub — 채용공고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --navy: #10254e;
    --navy-deep: #0a1a3a;
    --navy-light: #1b3568;
    --bg: #f2f3f6;
    --card: #ffffff;
    --line: #e4e6ec;
    --text: #1c2333;
    --text-sub: #6b7280;
    --text-faint: #9aa1b1;
    --red: #dc2626;
    --orange: #f5851f;
    --orange-deep: #db6e0f;
    --blue-chip: #eef2ff;
    --blue-chip-text: #3b4ba0;
  }

  html, body { height: 100%; }

  body{
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  ul { list-style: none; }

  /* ===== Header ===== */
  header.topbar{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(10,26,58,0.18);
  }
  .topbar-inner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 28px;
    height: 66px;
    display: flex;
    align-items: center;
    gap: 40px;
  }
  .logo{
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.3px;
    white-space: nowrap;
  }
  .logo-mark{
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: var(--navy-deep);
  }
  nav.main-nav{
    display: flex;
    gap: 4px;
    flex: 1;
  }
  nav.main-nav button{
    color: rgba(255,255,255,0.68);
    font-size: 15px;
    font-weight: 600;
    padding: 22px 16px;
    position: relative;
    transition: color .15s ease;
  }
  nav.main-nav button:hover{ color: #fff; }
  nav.main-nav button.active{ color: #fff; }
  nav.main-nav button.active::after{
    content: "";
    position: absolute;
    left: 16px; right: 16px; bottom: 0;
    height: 3px;
    background: var(--orange);
    border-radius: 3px 3px 0 0;
  }
  .topbar-right{
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .saved-pill{
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 20px;
  }
  .saved-pill b{ color: var(--orange); font-weight: 800; }

  /* ===== Layout ===== */
  main{ max-width: 1180px; margin: 0 auto; padding: 32px 28px 80px; }
  .page{ display: none; }
  .page.active{ display: block; }

  /* ===== Home page ===== */
  .hero{
    background: linear-gradient(120deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-light) 100%);
    border-radius: 20px;
    padding: 56px 48px;
    color: #fff;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .hero::after{
    content: "";
    position: absolute;
    right: -60px; top: -60px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(245,133,31,0.25) 0%, rgba(245,133,31,0) 70%);
  }
  .hero-eyebrow{
    font-size: 13px; font-weight: 700; color: var(--orange);
    letter-spacing: 0.5px; margin-bottom: 14px;
  }
  .hero h1{
    font-size: 34px; font-weight: 800; line-height: 1.4; letter-spacing: -0.5px;
    max-width: 560px;
  }
  .hero p{
    margin-top: 14px; color: rgba(255,255,255,0.7); font-size: 15px; max-width: 480px; line-height: 1.6;
  }
  .hero-search-bar{
    display: flex;
    gap: 10px;
    margin-top: 28px;
    max-width: 560px;
    position: relative;
    z-index: 1;
  }
  .hero-search-input-wrap{
    flex: 1;
    position: relative;
  }
  .hero-search-input-wrap::before{
    content: "🔎";
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: 0.55;
  }
  .hero-search-input-wrap input{
    width: 100%;
    padding: 15px 16px 15px 44px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.08);
    font-size: 15px;
    font-family: inherit;
    color: #fff;
  }
  .hero-search-input-wrap input::placeholder{ color: rgba(255,255,255,0.5); }
  .hero-search-input-wrap input:focus{
    outline: none; border-color: var(--orange);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 3px rgba(245,133,31,0.18);
  }
  .hero-search-btn{
    background: var(--orange);
    color: #fff;
    font-weight: 700;
    font-size: 14.5px;
    padding: 0 24px;
    border-radius: 12px;
    white-space: nowrap;
    transition: background .15s ease;
  }
  .hero-search-btn:hover{ background: var(--orange-deep); }

  .popular-keywords{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    max-width: 560px;
    position: relative;
    z-index: 1;
  }
  .popular-keywords-label{
    font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,0.55);
    white-space: nowrap;
  }
  .keyword-chip{
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    padding: 7px 13px 7px 10px;
    border-radius: 20px;
    transition: all .15s ease;
  }
  .keyword-chip:hover{
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.28);
    color: #fff;
  }
  .keyword-chip .rank{
    font-size: 11.5px; font-weight: 800; color: var(--orange);
  }
  .keyword-chip.rank-top .rank{ color: #ff8a65; }

  .stat-row{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    transition: box-shadow .15s ease, border-color .15s ease, transform .1s ease;
  }
  .stat-card:hover{
    box-shadow: 0 6px 20px rgba(16,37,78,0.08);
    border-color: #c7cfe6;
    transform: translateY(-1px);
  }
  .stat-card .num{ font-size: 26px; font-weight: 800; color: var(--navy); }
  .stat-card .label{ font-size: 13px; color: var(--text-sub); margin-top: 4px; font-weight: 500; }

  .section-title{
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title h2{ font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .section-title .more{ font-size: 13px; font-weight: 600; color: var(--text-sub); }
  .section-title .more:hover{ color: var(--navy); }

  .home-list{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 34px; }

  /* ===== Job card (shared) ===== */
  .job-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 20px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .job-card:hover{ box-shadow: 0 6px 20px rgba(16,37,78,0.08); border-color: #d7dbe6; }

  .job-main{ min-width: 0; }
  .job-top-row{ display: flex; align-items: center; gap: 9px; margin-bottom: 6px; flex-wrap: wrap; }
  .chip{
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
    background: var(--blue-chip); color: var(--blue-chip-text);
    white-space: nowrap;
  }
  .company{ font-size: 13.5px; font-weight: 700; color: var(--navy-light); }
  .job-title{
    font-size: 16px; font-weight: 800; color: var(--text);
    margin-bottom: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .job-meta{ display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-sub); flex-wrap: wrap; }
  .job-meta span{ display: flex; align-items: center; gap: 5px; }
  .job-meta .dot{ width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }

  .deadline-block{ text-align: right; white-space: nowrap; }
  .deadline-label{ font-size: 11.5px; color: var(--text-faint); font-weight: 600; margin-bottom: 3px; }
  .deadline-value{ font-size: 14.5px; font-weight: 800; color: var(--red); }
  .deadline-value.urgent::before{ content: "🔥 "; font-size: 12px; }

  .save-btn{
    background: var(--orange);
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 9px;
    white-space: nowrap;
    transition: background .15s ease, transform .1s ease;
  }
  .save-btn:hover{ background: var(--orange-deep); }
  .save-btn:active{ transform: scale(0.97); }
  .save-btn.saved{
    background: #eef0f4;
    color: var(--text-sub);
  }
  .save-btn.saved:hover{ background: #e4e7ee; }

  /* ===== Job list page ===== */
  .listing-layout{
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 24px;
    align-items: start;
  }

  .filter-panel{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
    position: sticky;
    top: 90px;
  }
  .filter-panel h3{
    font-size: 15px; font-weight: 800; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .filter-reset{ font-size: 12px; font-weight: 600; color: var(--text-faint); }
  .filter-reset:hover{ color: var(--navy); }
  .filter-group{ margin-bottom: 22px; }
  .filter-group:last-child{ margin-bottom: 0; }
  .filter-group-title{
    font-size: 12.5px; font-weight: 700; color: var(--text-sub);
    margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .filter-option{
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 2px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
  }
  .filter-option:hover{ color: var(--navy); }
  .filter-option input{ margin-right: 8px; accent-color: var(--navy); }
  .filter-option .fcount{ font-size: 11.5px; color: var(--text-faint); font-weight: 600; }
  .filter-option-label{ display: flex; align-items: center; }

  .listing-main{ min-width: 0; }

  .search-bar{
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .search-input-wrap{
    flex: 1; position: relative;
  }
  .search-input-wrap input{
    width: 100%;
    padding: 13px 16px 13px 40px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
  }
  .search-input-wrap input:focus{ outline: none; border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(27,53,104,0.1); }
  .search-input-wrap::before{
    content: "🔎";
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 14px; opacity: 0.5;
  }
  .sort-select{
    padding: 0 16px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    color: var(--text);
  }

  .active-filters{
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .active-filter-tag{
    display: flex; align-items: center; gap: 6px;
    background: var(--navy);
    color: #fff;
    font-size: 12.5px; font-weight: 600;
    padding: 6px 10px 6px 12px;
    border-radius: 20px;
  }
  .active-filter-tag button{ color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1; }
  .active-filter-tag button:hover{ color: #fff; }

  .result-count{
    font-size: 13.5px; color: var(--text-sub); margin-bottom: 12px; font-weight: 500;
  }
  .result-count b{ color: var(--navy); font-weight: 800; }

  .job-list{ display: flex; flex-direction: column; gap: 10px; }

  .empty-state{
    background: var(--card); border: 1px dashed var(--line); border-radius: 14px;
    padding: 60px 20px; text-align: center; color: var(--text-faint); font-size: 14px;
  }

  /* ===== News page ===== */
  .news-grid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .news-card{
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .news-tag{ font-size: 11.5px; font-weight: 700; color: var(--navy-light); }
  .news-card h3{ font-size: 15.5px; font-weight: 700; line-height: 1.45; }
  .news-card p{ font-size: 13px; color: var(--text-sub); line-height: 1.6; }
  .news-date{ font-size: 12px; color: var(--text-faint); margin-top: auto; }

  /* ===== Company page ===== */
  .company-filter-bar{
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .company-filter-btn{
    font-size: 13.5px; font-weight: 700; color: var(--text-sub);
    background: var(--card); border: 1px solid var(--line);
    padding: 9px 16px; border-radius: 20px;
    transition: all .15s ease;
  }
  .company-filter-btn:hover{ border-color: #c7cfe6; color: var(--navy); }
  .company-filter-btn.active{
    background: var(--navy); border-color: var(--navy); color: #fff;
  }
  .company-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .company-card{
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .company-badge{
    width: 42px; height: 42px; border-radius: 11px;
    background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
  }
  .company-card h3{ font-size: 15px; font-weight: 700; margin-top: 4px; }
  .company-card p{ font-size: 12.5px; color: var(--text-sub); }
  .company-openings{ font-size: 12px; color: var(--navy-light); font-weight: 700; margin-top: 4px; }
  .company-roles{ display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .company-role-tag{
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
    background: var(--blue-chip); color: var(--blue-chip-text);
  }

  /* ===== My page ===== */
  .mypage-header{
    display: flex; align-items: center; gap: 16px; margin-bottom: 26px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px;
  }
  .mypage-avatar{
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
  }
  .mypage-name{ font-size: 16px; font-weight: 800; }
  .mypage-email{ font-size: 13px; color: var(--text-sub); margin-top: 2px; }

  .empty-saved{
    background: var(--card); border: 1px dashed var(--line); border-radius: 14px;
    padding: 70px 20px; text-align: center;
  }
  .empty-saved .icon{ font-size: 34px; margin-bottom: 12px; }
  .empty-saved h3{ font-size: 15.5px; font-weight: 700; margin-bottom: 6px; }
  .empty-saved p{ font-size: 13.5px; color: var(--text-sub); margin-bottom: 18px; }
  .empty-saved button{
    background: var(--navy); color: #fff; font-weight: 700; font-size: 13.5px;
    padding: 11px 20px; border-radius: 9px;
  }

  @media (max-width: 860px){
    .topbar-inner{ gap: 18px; }
    nav.main-nav{ gap: 0; overflow-x: auto; }
    nav.main-nav button{ padding: 22px 10px; font-size: 13.5px; }
    .saved-pill span.txt{ display: none; }
    .listing-layout{ grid-template-columns: 1fr; }
    .filter-panel{ position: static; }
    .stat-row{ grid-template-columns: repeat(2, 1fr); }
    .job-card{ grid-template-columns: 1fr; }
    .deadline-block{ text-align: left; }
    .news-grid, .company-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" onclick="goPage('home')" style="cursor:pointer;"><span class="logo-mark">C</span>CareerHub</div>
    <nav class="main-nav" id="mainNav">
      <button data-page="home" class="active">홈</button>
      <button data-page="jobs">채용공고</button>
      <button data-page="news">채용뉴스</button>
      <button data-page="company">기업 정보</button>
      <button data-page="mypage">마이페이지</button>
    </nav>
  </div>
</header>

<main>

  <!-- ===== HOME ===== -->
  <section class="page active" id="page-home">
    <div class="hero">
      <div class="hero-eyebrow">CAREERHUB · 2026 채용 트렌드</div>
      <h1>지금 이 순간의 채용공고,<br>한 곳에서 놓치지 마세요.</h1>
      <p>커리어허브와 잡코리아의 공고를 통합해 매일 새로운 기회를 보여드려요. 관심 있는 공고는 저장해두고 마감일을 놓치지 마세요.</p>

      <div class="hero-search-bar">
        <div class="hero-search-input-wrap">
          <input type="text" id="homeSearchInput" placeholder="회사명, 공고 제목, 직무로 검색해보세요" onkeydown="if(event.key==='Enter') runHomeSearch()">
        </div>
        <button class="hero-search-btn" onclick="runHomeSearch()">검색</button>
      </div>
      <div class="popular-keywords" id="popularKeywords"></div>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="section-title">
      <h2>마감 임박 공고</h2>
      <span class="more" onclick="goPage('jobs')">전체보기 →</span>
    </div>
    <div class="home-list" id="homeUrgentList"></div>

    <div class="section-title">
      <h2>개발 직군 신규 공고</h2>
      <span class="more" onclick="goPage('jobs')">전체보기 →</span>
    </div>
    <div class="home-list" id="homeDevList"></div>
  </section>

  <!-- ===== JOBS ===== -->
  <section class="page" id="page-jobs">
    <div class="listing-layout">
      <aside class="filter-panel">
        <h3>상세 필터 <span class="filter-reset" onclick="resetFilters()">초기화</span></h3>

        <div class="filter-group">
          <div class="filter-group-title">직무</div>
          <div id="filterJob"></div>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">지역</div>
          <div id="filterRegion"></div>
        </div>
      </aside>

      <div class="listing-main">
        <div class="search-bar">
          <div class="search-input-wrap">
            <input type="text" id="searchInput" placeholder="회사명 또는 공고 제목으로 검색">
          </div>
          <select class="sort-select" id="sortSelect">
            <option value="deadline_asc">마감일 빠른순</option>
            <option value="deadline_desc">마감일 늦은순</option>
            <option value="latest">등록번호순</option>
          </select>
        </div>

        <div class="active-filters" id="activeFilters"></div>
        <div class="result-count" id="resultCount"></div>
        <div class="job-list" id="jobList"></div>
      </div>
    </div>
  </section>

  <!-- ===== NEWS ===== -->
  <section class="page" id="page-news">
    <div class="section-title"><h2>채용뉴스</h2></div>
    <div class="news-grid" id="newsGrid"></div>
  </section>

  <!-- ===== COMPANY ===== -->
  <section class="page" id="page-company">
    <div class="section-title"><h2>기업 정보</h2></div>
    <div class="company-filter-bar" id="companyFilterBar"></div>
    <div class="result-count" id="companyResultCount"></div>
    <div class="company-grid" id="companyGrid"></div>
  </section>

  <!-- ===== MYPAGE ===== -->
  <section class="page" id="page-mypage">
    <div class="mypage-header">
      <div class="mypage-avatar">김</div>

  function parseDate(str){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(str)) return null;
    return new Date(str + "T00:00:00");
  }
  const TODAY = new Date("2026-08-24T00:00:00");

  function daysLeft(str){
    const d = parseDate(str);
    if(!d) return null;
    return Math.round((d - TODAY) / 86400000);
  }

  function deadlineDisplay(job){
    const dl = daysLeft(job.마감일);
    if(dl === null) return `<span class="deadline-value">${job.마감일}</span>`;

    const label = dl < 0 ? "마감" : dl === 0 ? "D-day" : `D-${dl}`;
    return `<span class="deadline-value ${urgent ? 'urgent' : ''}">${job.마감일} (${label})</span>`;
  }

      { num: JOBS.length, label: "전체 채용공고", page: "jobs" },
      { num: new Set(JOBS.map(j => j.회사명)).size, label: "채용 중인 기업", page: "company" },
      { num: NEWS.length, label: "채용 뉴스", page: "news" }
    ];
    document.getElementById('statRow').innerHTML = stats.map(s => `
      <div class="stat-card" onclick="goPage('${s.page}')" style="cursor:pointer;">
        <div class="num">${s.num}</div>
        <div class="label">${s.label}</div>
      </div>`).join('');

    const urgent = [...JOBS]
      .filter(j => daysLeft(j.마감일) !== null && daysLeft(j.마감일) >= 0)
      .sort((a,b) => daysLeft(a.마감일) - daysLeft(b.마감일))
      .slice(0, 3);
    document.getElementById('homeUrgentList').innerHTML = urgent.map(jobCardHTML).join('');

    const devJobs = JOBS.filter(j => j.직무 === "개발").slice(0, 3);
    document.getElementById('homeDevList').innerHTML = devJobs.map(jobCardHTML).join('');
  }

  // ===== Filter panel render =====
  function countBy(key, value){
    return JOBS.filter(j => j[key] === value).length;
  }

  function renderFilterPanel(){
    const jobTypes = [...new Set(JOBS.map(j => j.직무))].sort((a,b) => countBy('직무', b) - countBy('직무', a));
    const regions = [...new Set(JOBS.map(j => regionShort(j.지역)))].sort((a,b) => a.localeCompare(b));

    document.getElementById('filterJob').innerHTML = jobTypes.map(v => `
      <label class="filter-option">
        <span class="filter-option-label"><input type="checkbox" ${filters.job.has(v)?'checked':''} onchange="toggleFilter('job','${v}')">${v}</span>
        <span class="fcount">${countBy('직무', v)}</span>
      </label>`).join('');

    document.getElementById('filterRegion').innerHTML = regions.map(v => `
      <label class="filter-option">
        <span class="filter-option-label"><input type="checkbox" ${filters.region.has(v)?'checked':''} onchange="toggleFilter('region','${v}')">${v}</span>
      </label>`).join('');
  }

  function toggleFilter(group, value){
    if(filters[group].has(value)) filters[group].delete(value);
    else filters[group].add(value);
    renderJobsPage();
  }
  window.toggleFilter = toggleFilter;

  function resetFilters(){
    filters = { job: new Set(), region: new Set() };
    searchQuery = "";
    document.getElementById('searchInput').value = "";
    renderJobsPage();
  }
  window.resetFilters = resetFilters;

  function removeActiveFilter(group, value){
    filters[group].delete(value);
    renderJobsPage();
  }
  window.removeActiveFilter = removeActiveFilter;

  // ===== Jobs page render =====
  function getFilteredJobs(){
    let list = JOBS.filter(j => {
      if(filters.job.size && !filters.job.has(j.직무)) return false;
      if(filters.region.size && !filters.region.has(regionShort(j.지역))) return false;
      if(searchQuery){
        const q = searchQuery.toLowerCase();
        const haystack = `${j.회사명} ${j.공고명} ${j.직무} ${j.지역}`.toLowerCase();
        if(!haystack.includes(q)) return false;
      }
      return true;
    });

    if(sortMode === "deadline_asc"){
      list.sort((a,b) => (daysLeft(a.마감일) ?? 9999) - (daysLeft(b.마감일) ?? 9999));
    } else if(sortMode === "deadline_desc"){
      list.sort((a,b) => (daysLeft(b.마감일) ?? -9999) - (daysLeft(a.마감일) ?? -9999));
    } else {
      list.sort((a,b) => a.번호 - b.번호);
    }
    return list;
  }

  function renderJobsPage(){
    renderFilterPanel();

    const tags = [];
    filters.job.forEach(v => tags.push({group:'job', value:v}));
    filters.region.forEach(v => tags.push({group:'region', value:v}));
    document.getElementById('activeFilters').innerHTML = tags.map(t => `
      <span class="active-filter-tag">${t.value}<button onclick="removeActiveFilter('${t.group}','${t.value}')">✕</button></span>`).join('');

    const filtered = getFilteredJobs();
    document.getElementById('resultCount').innerHTML = `총 <b>${filtered.length}</b>건의 공고`;

    document.getElementById('jobList').innerHTML = filtered.length
      ? filtered.map(jobCardHTML).join('')
      : `<div class="empty-state">조건에 맞는 채용공고가 없어요. 필터를 조정해보세요.</div>`;
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderJobsPage();
  });
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    sortMode = e.target.value;
    renderJobsPage();
  });

  // ===== News / Company render =====
  function renderNews(){
    document.getElementById('newsGrid').innerHTML = NEWS.map(n => `
      <div class="news-card">
        <div class="news-tag">${n.tag}</div>
        <h3>${n.title}</h3>
        <p>${n.desc}</p>
        <div class="news-date">${n.date}</div>
      </div>`).join('');
  }

  function setCompanyFilter(label){
    companyFilter = (companyFilter === label) ? null : label;
    renderCompany();
  }
  window.setCompanyFilter = setCompanyFilter;

  function renderCompany(){
    document.getElementById('companyFilterBar').innerHTML = `
      <button class="company-filter-btn ${companyFilter === null ? 'active' : ''}" onclick="setCompanyFilter(null)">전체</button>
      ${COMPANY_FILTER_GROUPS.map(g => `
        <button class="company-filter-btn ${companyFilter === g.label ? 'active' : ''}" onclick="setCompanyFilter('${g.label}')">${g.label}</button>`).join('')}
    `;

    const activeGroup = COMPANY_FILTER_GROUPS.find(g => g.label === companyFilter);
    const companies = activeGroup
      ? uniqueCompanies.filter(c => JOBS.some(j => j.회사명 === c.회사명 && activeGroup.jobs.includes(j.직무)))
      : uniqueCompanies;

    document.getElementById('companyResultCount').innerHTML = `총 <b>${companies.length}</b>개 기업`;

    document.getElementById('companyGrid').innerHTML = companies.length ? companies.map(c => {
      const roles = [...new Set(JOBS.filter(j => j.회사명 === c.회사명).map(j => j.직무))];
      return `
      <div class="company-card">
        <div class="company-badge">${c.회사명.charAt(0)}</div>
        <h3>${c.회사명}</h3>
        <p>📍 ${c.지역}</p>
        <div class="company-roles">${roles.map(r => `<span class="company-role-tag">${r}</span>`).join('')}</div>
        <div class="company-openings">채용중 ${JOBS.filter(j=>j.회사명===c.회사명).length}건</div>
      </div>`;
    }).join('') : `<div class="empty-state">해당 분야에 등록된 기업이 없어요.</div>`;
  }

  // ===== My page render =====
  function renderMyPage(){
    const list = JOBS.filter(j => savedIds.has(j.번호));
    document.getElementById('savedJobList').innerHTML = list.length
      ? list.map(jobCardHTML).join('')
      : `<div class="empty-saved">
           <div class="icon">📭</div>
           <h3>저장한 공고가 없어요</h3>
           <p>관심있는 채용공고의 저장하기 버튼을 눌러보세요.</p>
           <button onclick="goPage('jobs')">채용공고 보러가기</button>
         </div>`;
  }

  // ===== Master render =====
  function renderAll(){
    renderHome();
    renderJobsPage();
    renderMyPage();
  }

  renderAll();
  renderNews();
  renderCompany();
  renderPopularKeywords();
</script>
</body>
</html>
